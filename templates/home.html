{% extends 'base.html' %}

{% block content %}

<div class="content-card text-center">

    {% if user %}

        <h1 class="greeting user">
            Hello {{ user }}!
        </h1>

    {% else %}

        <h1 class="greeting">
            Hello world!
        </h1>

    {% endif %}

    <p class="text-muted mt-3">
        Welcome to my Flask application.
    </p>

    <a
        href="{{ url_for('index') }}"
        class="btn btn-primary mt-3"
    >
        Go to Items
    </a>

</div>

{% endblock %}
