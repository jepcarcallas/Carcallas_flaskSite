{% extends 'base.html' %}

{% block content %}

<div class="content-card">

    <h1 class="page-title mb-4">
        Create a New Item
    </h1>

    {% if error %}

    <div class="alert alert-danger">
        {{ error }}
    </div>

    {% endif %}

    <form method="POST">

        <div class="mb-3">

            <label for="name" class="form-label">
                Item Name
            </label>

            <input
                type="text"
                class="form-control"
                id="name"
                name="name"
                placeholder="Enter item name"
                maxlength="100"
                required
            >

        </div>

        <button
            type="submit"
            class="btn btn-success"
        >
            Create Item
        </button>

        <a
            href="{{ url_for('index') }}"
            class="btn btn-secondary"
        >
            Cancel
        </a>

    </form>

</div>

{% endblock %}
